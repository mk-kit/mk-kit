name: Release validators

# Publishes @mk-kit/validators to npm with provenance when the version in
# projects/validators/package.json changes on `main`, then tags
# `validators-v<version>` and opens a GitHub Release with that version's
# section of projects/validators/CHANGELOG.md.
#
# Auth: npm trusted publishing (OIDC) — npmjs.com → @mk-kit/validators →
# Settings → Trusted publisher: GitHub Actions, mk-kit/mk-kit,
# workflow release-validators.yml, environment `npm`. The very first version
# is published by hand from dist/validators (that creates the package the
# trusted publisher is then attached to).
#
# Idempotent: a version already on the registry, an existing tag or an
# existing release is skipped, so re-runs cannot double-publish.
on:
  push:
    branches: [main]
    paths: ['projects/validators/**', '.github/workflows/release-validators.yml']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-validators
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @mk-kit/validators
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Resolve version
        id: resolve
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./projects/validators/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if ! npm view @mk-kit/validators version >/dev/null 2>&1; then
            echo "::warning::@mk-kit/validators does not exist on npm yet — publish $VERSION once by hand from dist/validators, then configure its trusted publisher."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif npm view "@mk-kit/validators@$VERSION" version >/dev/null 2>&1; then
            echo "@mk-kit/validators@$VERSION is already published — nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build + test
        if: steps.resolve.outputs.publish == 'true'
        run: npm run build:validators && npm run test:validators

      - name: Publish
        if: steps.resolve.outputs.publish == 'true'
        working-directory: dist/validators
        run: |
          set -euo pipefail
          npm pack --dry-run
          npm publish --access public --provenance

      - name: Tag + GitHub Release
        if: steps.resolve.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          TAG="validators-v$VERSION"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "@mk-kit/validators $VERSION"
            git push origin "$TAG"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            node scripts/changelog-section.mjs "$VERSION" projects/validators/CHANGELOG.md > release-notes.md
            gh release create "$TAG" --title "@mk-kit/validators $VERSION" --notes-file release-notes.md
          fi
