name: Verify

# The single build+test definition, called by both CI (on push/PR) and Release
# (before publishing). Keeping it in one place means a release can never ship
# something CI would have rejected.
on:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # Angular 22's CLI requires Node >= 24.15.
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:lib

      - name: Check bundle-size budget
        run: node scripts/check-size.mjs
      - name: Selector map for the docs is current
        run: node scripts/gen-selectors.mjs --check
      - name: API reference + llms.txt are current
        run: node scripts/gen-api.mjs --check

      - name: Test library
        run: npm run test:lib

      - name: Test docs
        run: npm run test:docs

      - name: Build + test MCP server
        run: npm run build:mcp && npm run test:mcp

      - name: Build docs
        run: npm run build

      # `npm pack --dry-run` validates the tarball (files, package.json, exports)
      # without the registry check that `npm publish --dry-run` performs — the
      # latter fails on every PR that does not bump the version, because the
      # current version is already published.
      - name: Verify package (pack dry-run)
        run: npm pack --dry-run
        working-directory: dist/mk-kit

      - name: Verify MCP package (pack dry-run)
        run: npm pack --dry-run
        working-directory: dist/mcp

      - name: Upload built package
        uses: actions/upload-artifact@v7
        with:
          name: mk-kit-dist
          path: dist/mk-kit
          retention-days: 7
