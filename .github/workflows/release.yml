name: Release

# Publishes @mkornas/ui privately to GitHub Packages when a version tag
# (e.g. v0.1.0) is pushed. Auth uses the built-in GITHUB_TOKEN — no secret to
# configure. Package visibility follows the repository (private repo → private
# package); consumers need a PAT with `read:packages` to install.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@mkornas'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:lib

      - name: Test library
        run: npm run test:lib

      - name: Publish to GitHub Packages
        run: npm publish
        working-directory: dist/mk-kit
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
