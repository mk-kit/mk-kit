@if (variant() === 'slim') {
  <button
    type="button"
    class="mk-block-inserter__slim-trigger"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="panelId"
    [disabled]="disabled()"
    [attr.aria-label]="i18n.blockEditor.insertBlockHere"
    (click)="toggle()"
  >
    <span class="mk-block-inserter__plus" aria-hidden="true">＋</span>
  </button>
} @else {
  <button
    type="button"
    class="mk-block-inserter__trigger"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="panelId"
    [disabled]="disabled()"
    (click)="toggle()"
  >
    <span class="mk-block-inserter__plus" aria-hidden="true">＋</span>
    {{ label() }}
  </button>
}

@if (open()) {
  <div class="mk-block-inserter__panel" [id]="panelId" role="dialog" [attr.aria-label]="i18n.blockEditor.blockInserter">
    <input
      #search
      type="text"
      class="mk-block-inserter__search"
      role="combobox"
      aria-autocomplete="list"
      [attr.aria-expanded]="true"
      [attr.aria-controls]="listId"
      [attr.aria-activedescendant]="filtered().length ? optionId(activeIndex()) : null"
      [placeholder]="i18n.blockEditor.searchBlocks"
      [value]="query()"
      (input)="onQuery($event)"
      (keydown)="onKeydown($event)"
    />

    <div class="mk-block-inserter__list" [id]="listId" role="listbox" [attr.aria-label]="i18n.blockEditor.blocks">
      @for (group of groups(); track group.name) {
        <div class="mk-block-inserter__group" role="group" [attr.aria-label]="group.name">
          <div class="mk-block-inserter__group-label">{{ group.name }}</div>
          @for (item of group.items; track item.def.type) {
            <button
              type="button"
              class="mk-block-inserter__option"
              [class.mk-block-inserter__option--active]="item.index === activeIndex()"
              [id]="optionId(item.index)"
              role="option"
              [attr.aria-selected]="item.index === activeIndex()"
              (mouseenter)="activeIndex.set(item.index)"
              (click)="choose(item.def)"
            >
              <span class="mk-block-inserter__icon" aria-hidden="true">{{ item.def.icon ?? '▢' }}</span>
              <span class="mk-block-inserter__text">
                <span class="mk-block-inserter__name">{{ item.def.label }}</span>
                @if (item.def.description) {
                  <span class="mk-block-inserter__desc">{{ item.def.description }}</span>
                }
              </span>
            </button>
          }
        </div>
      }
      @if (!filtered().length) {
        <p class="mk-block-inserter__empty">{{ i18n.blockEditor.noBlocksMatch(query()) }}</p>
      }
    </div>
  </div>
}
