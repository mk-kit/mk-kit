@if (open()) {
  <div class="mk-banner__box">
    <span class="mk-banner__icon" aria-hidden="true"
      ><ng-content select="[mkBannerIcon]"
    /></span>
    <!-- The live region wraps only the title + message, keeping the actions
         and the dismiss button out of what gets announced. -->
    <div class="mk-banner__body" [attr.role]="role()">
      @if (title()) {
        <p class="mk-banner__title">{{ title() }}</p>
      }
      <div class="mk-banner__message"><ng-content /></div>
    </div>
    <div class="mk-banner__actions"><ng-content select="[mkBannerActions]" /></div>
    @if (dismissible()) {
      <button
        type="button"
        class="mk-banner__close"
        [attr.aria-label]="i18n.dismiss"
        (click)="dismiss()"
      >
        <span aria-hidden="true">&times;</span>
      </button>
    }
  </div>
}
