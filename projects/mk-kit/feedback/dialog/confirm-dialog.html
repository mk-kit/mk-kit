<mk-dialog [dialogTitle]="data.title" hideClose>
  <div class="mk-confirm-dialog__body">
    @if (data.icon; as icon) {
      <mk-icon
        class="mk-confirm-dialog__icon"
        [class.mk-confirm-dialog__icon--danger]="data.tone === 'danger'"
        [name]="icon"
        [size]="22"
      />
    }
    <p class="mk-confirm-dialog__message">{{ data.message }}</p>
  </div>

  <div mkDialogFooter>
    @if (!data.hideCancel) {
      <button mkButton variant="ghost" tone="neutral" (click)="cancel()">
        {{ cancelText() }}
      </button>
    }
    <button mkButton [tone]="confirmTone()" (click)="confirm()">
      {{ confirmText() }}
    </button>
  </div>
</mk-dialog>
