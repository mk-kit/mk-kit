@if (opened()) {
  <div
    #panel
    class="mk-hovercard__panel"
    role="dialog"
    tabindex="-1"
    [id]="panelId"
    [attr.aria-label]="ariaLabel()"
    mkAnchoredPanel
    [mkAnchoredPanelFor]="anchorEl()"
    [placement]="placement()"
    [gap]="8"
    (dismiss)="close()"
    (mouseenter)="onCardEnter()"
    (mouseleave)="onCardLeave()"
    (focusin)="onCardEnter()"
    (focusout)="onCardFocusout($event)"
    (keydown.escape)="onEscape($event)"
  >
    <ng-content />
  </div>
}
