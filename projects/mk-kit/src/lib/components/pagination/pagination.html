<nav [attr.aria-label]="label()">
  <ul class="mk-pagination__list" role="list">
    <li>
      <button
        type="button"
        class="mk-pagination__btn mk-pagination__btn--nav"
        aria-label="Go to previous page"
        [disabled]="!hasPrev()"
        (click)="prev()"
      >
        <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="15 18 9 12 15 6" />
        </svg>
      </button>
    </li>

    @for (item of items(); track $index) {
      @if (item === 'ellipsis') {
        <li>
          <span class="mk-pagination__ellipsis" aria-hidden="true">…</span>
        </li>
      } @else {
        <li>
          <button
            type="button"
            class="mk-pagination__btn"
            [class.mk-pagination__btn--active]="item === current()"
            [attr.aria-label]="'Go to page ' + item"
            [attr.aria-current]="item === current() ? 'page' : null"
            (click)="goTo(item)"
          >
            {{ item }}
          </button>
        </li>
      }
    }

    <li>
      <button
        type="button"
        class="mk-pagination__btn mk-pagination__btn--nav"
        aria-label="Go to next page"
        [disabled]="!hasNext()"
        (click)="next()"
      >
        <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="9 18 15 12 9 6" />
        </svg>
      </button>
    </li>
  </ul>
</nav>
