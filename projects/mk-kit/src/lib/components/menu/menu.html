@if (opened()) {
  <div
    class="mk-menu__panel"
    role="menu"
    [id]="panelId"
    mkAnchoredPanel
    [mkAnchoredPanelFor]="anchorEl()"
    [anchorRect]="anchorPoint()"
    placement="bottom-start"
    (dismiss)="close(false)"
    [attr.aria-label]="ariaLabel()"
    (keydown)="onPanelKeydown($event)"
  >
    <ng-content />
  </div>
}
