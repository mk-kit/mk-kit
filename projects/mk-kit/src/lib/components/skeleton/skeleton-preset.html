@switch (preset()) {
  @case ('card') {
    <mk-skeleton shape="rect" width="100%" [height]="150" />
    <mk-skeleton shape="rect" width="60%" [height]="18" />
    <mk-skeleton shape="text" [lines]="2" />
  }
  @case ('list') {
    @for (r of rowRange(); track r) {
      <div class="mk-skeleton-preset__row">
        <mk-skeleton shape="circle" [width]="40" [height]="40" />
        <div class="mk-skeleton-preset__lines">
          <mk-skeleton shape="rect" width="40%" [height]="13" />
          <mk-skeleton shape="rect" width="72%" [height]="11" />
        </div>
      </div>
    }
  }
  @case ('table') {
    <div class="mk-skeleton-preset__thead" [style.grid-template-columns]="'repeat(' + colRange().length + ', 1fr)'">
      @for (c of colRange(); track c) {
        <mk-skeleton shape="rect" width="70%" [height]="13" />
      }
    </div>
    @for (r of rowRange(); track r) {
      <div class="mk-skeleton-preset__trow" [style.grid-template-columns]="'repeat(' + colRange().length + ', 1fr)'">
        @for (c of colRange(); track c) {
          <mk-skeleton shape="rect" width="85%" [height]="11" />
        }
      </div>
    }
  }
  @default {
    <mk-skeleton shape="rect" width="45%" [height]="18" />
    <mk-skeleton shape="text" [lines]="rows()" />
  }
}
