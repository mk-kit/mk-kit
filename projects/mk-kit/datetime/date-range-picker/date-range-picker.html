<div #field class="mk-date-range-picker__field">
  <button
    #trigger
    type="button"
    class="mk-date-range-picker__trigger"
    [id]="triggerId"
    aria-haspopup="dialog"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="panelId"
    [attr.aria-labelledby]="labelledBy()"
    [attr.aria-describedby]="describedBy()"
    [attr.aria-invalid]="isInvalid() || null"
    [attr.aria-required]="isRequired() || null"
    [disabled]="isDisabled()"
    (click)="toggle()"
  >
    @if (displayLabel()) {
      <span class="mk-date-range-picker__value">{{ displayLabel() }}</span>
    } @else {
      <span class="mk-date-range-picker__value mk-date-range-picker__value--placeholder">{{
        placeholder()
      }}</span>
    }
  </button>

  @if (showClear()) {
    <button
      type="button"
      class="mk-date-range-picker__clear"
      [attr.aria-label]="i18n.clear"
      (click)="clear()"
    >
      <span class="mk-date-range-picker__clear-icon" aria-hidden="true"></span>
    </button>
  }

  <button
    type="button"
    class="mk-date-range-picker__toggle"
    [attr.aria-label]="i18n.openCalendar"
    aria-haspopup="dialog"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="panelId"
    [disabled]="isDisabled()"
    (click)="toggle()"
  >
    <svg
      class="mk-date-range-picker__icon"
      viewBox="0 0 24 24"
      width="18"
      height="18"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      aria-hidden="true"
    >
      <rect x="3" y="4" width="18" height="17" rx="2" />
      <path d="M3 9h18M8 2v4M16 2v4" />
    </svg>
  </button>
</div>

@if (open()) {
  <div
    #panel
    class="mk-date-range-picker__panel"
    mkAnchoredPanel
    [mkAnchoredPanelFor]="field"
    (dismiss)="close()"
    [id]="panelId"
    role="dialog"
    [attr.aria-label]="i18n.chooseDateRange"
    (keydown.escape)="onPanelEscape($event)"
    (focusout)="onPanelFocusout($event)"
  >
    <mk-calendar
      [rangeMode]="true"
      [rangeStart]="selStart()"
      [rangeEnd]="selEnd()"
      (dateSelected)="onPick($event)"
      [min]="min()"
      [max]="max()"
      [disabledDate]="disabledDate()"
      [firstDayOfWeek]="firstDayOfWeek()"
      [size]="effectiveSize()"
    />
  </div>
}
