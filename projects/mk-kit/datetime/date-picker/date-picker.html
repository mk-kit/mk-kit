<div #field class="mk-date-picker__field">
  <input
    #textInput
    type="text"
    class="mk-date-picker__input"
    [id]="inputId"
    [value]="inputText()"
    [placeholder]="placeholder()"
    [disabled]="isDisabled()"
    autocomplete="off"
    role="combobox"
    [attr.aria-label]="ariaLabelAttr()"
    aria-haspopup="dialog"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="panelId"
    [attr.aria-invalid]="isInvalid() || null"
    [attr.aria-required]="isRequired() || null"
    [attr.aria-describedby]="describedBy()"
    (input)="onInput($event)"
    (keydown)="onInputKeydown($event)"
  />

  @if (showClear()) {
    <button
      type="button"
      class="mk-date-picker__clear"
      [attr.aria-label]="i18n.clear"
      (click)="clear()"
    >
      <span class="mk-date-picker__clear-icon" aria-hidden="true"></span>
    </button>
  }

  <button
    type="button"
    class="mk-date-picker__toggle"
    [attr.aria-label]="i18n.openCalendar"
    aria-haspopup="dialog"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="panelId"
    [disabled]="isDisabled()"
    (click)="toggle()"
  >
    <svg
      class="mk-date-picker__icon"
      viewBox="0 0 24 24"
      width="18"
      height="18"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      aria-hidden="true"
    >
      <rect x="3" y="4" width="18" height="17" rx="2" />
      <path d="M3 9h18M8 2v4M16 2v4" />
    </svg>
  </button>
</div>

@if (open()) {
  <div
    #panel
    class="mk-date-picker__panel"
    mkAnchoredPanel
    [mkAnchoredPanelFor]="field"
    (dismiss)="close()"
    [id]="panelId"
    role="dialog"
    [attr.aria-label]="i18n.chooseDate"
    (keydown.escape)="onPanelEscape($event)"
    (focusout)="onPanelFocusout($event)"
  >
    <mk-calendar
      [value]="value()"
      (valueChange)="onCalendarPick($event)"
      [min]="min()"
      [max]="max()"
      [firstDayOfWeek]="firstDayOfWeek()"
      [size]="effectiveSize()"
      [disabledDate]="disabledDate()"
    />
  </div>
}
