<div #field class="mk-time-picker__field">
  <input
    #textInput
    type="text"
    class="mk-time-picker__input"
    [id]="inputId"
    [value]="inputText()"
    [placeholder]="placeholder()"
    [disabled]="isDisabled()"
    autocomplete="off"
    role="combobox"
    [attr.aria-label]="ariaLabelAttr()"
    aria-haspopup="listbox"
    aria-autocomplete="none"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="listId"
    [attr.aria-activedescendant]="
      open() && activeIndex() >= 0 ? optionId(activeIndex()) : null
    "
    [attr.aria-invalid]="isInvalid() || null"
    [attr.aria-required]="isRequired() || null"
    [attr.aria-describedby]="describedBy()"
    (input)="onInput($event)"
    (keydown)="onInputKeydown($event)"
  />

  @if (showClear()) {
    <button
      type="button"
      class="mk-time-picker__clear"
      [attr.aria-label]="i18n.clear"
      (click)="clear()"
    >
      <span class="mk-time-picker__clear-icon" aria-hidden="true"></span>
    </button>
  }

  <button
    type="button"
    class="mk-time-picker__toggle"
    [attr.aria-label]="i18n.openTimeList"
    aria-haspopup="listbox"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="listId"
    [disabled]="isDisabled()"
    (click)="toggle()"
  >
    <svg
      class="mk-time-picker__icon"
      viewBox="0 0 24 24"
      width="18"
      height="18"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="9" />
      <path d="M12 7v5l3 2" />
    </svg>
  </button>
</div>

@if (open()) {
  <ul
    #list
    class="mk-time-picker__list"
    mkAnchoredPanel
    [mkAnchoredPanelFor]="field"
    [matchWidth]="true"
    (dismiss)="close()"
    [id]="listId"
    role="listbox"
  >
    @for (opt of options(); track opt.value; let i = $index) {
      <li
        class="mk-time-picker__option"
        [id]="optionId(i)"
        role="option"
        [attr.aria-selected]="i === selectedIndex()"
        [class.mk-time-picker__option--active]="i === activeIndex()"
        [class.mk-time-picker__option--selected]="i === selectedIndex()"
        (mousedown)="$event.preventDefault()"
        (mousemove)="activeIndex.set(i)"
        (click)="selectOption(i)"
      >
        {{ opt.label }}
      </li>
    } @empty {
      <li class="mk-time-picker__empty" role="presentation">
        {{ i18n.noOptions }}
      </li>
    }
  </ul>
}
