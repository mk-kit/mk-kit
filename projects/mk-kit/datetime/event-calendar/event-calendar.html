<div class="mk-event-calendar__header">
  <button
    type="button"
    class="mk-event-calendar__nav"
    [attr.aria-label]="i18n.previousMonth"
    (click)="prevMonth()"
  >
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path
        d="M15 5l-7 7 7 7"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>

  <span class="mk-event-calendar__label" [id]="labelId" aria-live="polite">{{
    monthLabel()
  }}</span>

  <button
    type="button"
    class="mk-event-calendar__nav"
    [attr.aria-label]="i18n.nextMonth"
    (click)="nextMonth()"
  >
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path
        d="M9 5l7 7-7 7"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>
</div>

<!--
  The days are a plain list of buttons (role="group"), not an ARIA grid — there
  is no roving-tabindex arrow navigation here, so grid semantics would be wrong.
-->
<div class="mk-event-calendar__grid" role="group" [attr.aria-labelledby]="labelId">
  <div class="mk-event-calendar__weekdays" aria-hidden="true">
    @for (wd of weekdays(); track $index) {
      <span class="mk-event-calendar__weekday">
        <abbr [title]="wd.full">{{ wd.short }}</abbr>
      </span>
    }
  </div>

  @for (week of weekCells(); track $index) {
    <div class="mk-event-calendar__week">
      @for (cell of week; track cell.date.getTime()) {
        <button
          type="button"
          class="mk-event-calendar__cell"
          [class.mk-event-calendar__cell--outside]="cell.outside"
          [class.mk-event-calendar__cell--today]="cell.today"
          [attr.aria-label]="dayLabel(cell)"
          [attr.aria-current]="cell.today ? 'date' : null"
          (click)="onDayClick(cell.date)"
        >
          <span class="mk-event-calendar__day-num">{{
            cell.date.getDate()
          }}</span>

          <!--
            Presentational for assistive tech: the day button's aria-label
            already announces the events, and nested interactive content inside
            a button is invalid. The pill (click) is a mouse-only shortcut to
            `eventClick`; keyboard users activate the day (`dayClick`) instead.
          -->
          <span class="mk-event-calendar__events" aria-hidden="true">
            @for (event of cell.visible; track $index) {
              <span
                class="mk-event-calendar__pill"
                [style.background-color]="event.color || 'var(--mk-primary)'"
                [title]="event.title"
                (click)="onEventClick($event, event)"
              >
                {{ event.title }}
              </span>
            }
            @if (cell.overflow > 0) {
              <span class="mk-event-calendar__more"
                >+{{ cell.overflow }} more</span
              >
            }
          </span>
        </button>
      }
    </div>
  }
</div>
