<div
  #viewport
  class="mk-image-cropper__viewport"
  role="application"
  [attr.tabindex]="disabled() ? -1 : 0"
  [attr.aria-label]="ariaLabel() || i18n.zoom"
  [attr.aria-disabled]="disabled() || null"
  [class.mk-image-cropper__viewport--fill]="aspect() === null"
  [class.mk-image-cropper__viewport--dragging]="dragging()"
  [style.aspect-ratio]="aspect()"
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerUp()"
  (pointercancel)="onPointerUp()"
  (keydown)="onKeydown($event)"
>
  @if (status() === 'error') {
    <div class="mk-image-cropper__error">{{ i18n.imageFailed }}</div>
  } @else {
    <img
      #image
      class="mk-image-cropper__image"
      [class.mk-image-cropper__image--ready]="status() === 'loaded'"
      [src]="src()"
      alt=""
      draggable="false"
      [attr.crossorigin]="crossOrigin()"
      [style.transform]="imageTransform()"
      (load)="onImageLoad($event)"
      (error)="onImageError()"
    />
    <div class="mk-image-cropper__grid" aria-hidden="true"></div>
    @if (round()) {
      <div class="mk-image-cropper__mask" aria-hidden="true"></div>
    }
  }
</div>

<div class="mk-image-cropper__controls">
  <button
    type="button"
    class="mk-image-cropper__zoom-btn"
    [attr.aria-label]="i18n.zoomOut"
    [disabled]="disabled() || zoom() <= minZoom()"
    (click)="stepZoom(-1)"
  >
    <span aria-hidden="true">&minus;</span>
  </button>
  <input
    type="range"
    class="mk-image-cropper__range"
    step="0.01"
    [min]="minZoom()"
    [max]="maxZoom()"
    [value]="zoom()"
    [disabled]="disabled()"
    [attr.aria-label]="i18n.zoom"
    (input)="onRangeInput($event)"
  />
  <button
    type="button"
    class="mk-image-cropper__zoom-btn"
    [attr.aria-label]="i18n.zoomIn"
    [disabled]="disabled() || zoom() >= maxZoom()"
    (click)="stepZoom(1)"
  >
    <span aria-hidden="true">+</span>
  </button>
</div>
