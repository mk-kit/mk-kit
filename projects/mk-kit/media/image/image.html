<figure class="mk-image__figure">
  <div class="mk-image__frame" [style.aspect-ratio]="aspectRatio()">
    @if (state() !== 'error') {
      <img
        class="mk-image__img"
        [src]="src()"
        [alt]="alt()"
        [attr.srcset]="srcset() || null"
        [attr.sizes]="sizes() || null"
        [attr.loading]="loadingAttr()"
        [attr.fetchpriority]="priority() ? 'high' : null"
        [attr.decoding]="priority() ? 'sync' : 'async'"
        (load)="onLoad()"
        (error)="onError()"
      />
      @if (state() === 'loading') {
        <span class="mk-image__skeleton" aria-hidden="true"></span>
      }
    } @else {
      <div class="mk-image__fallback">
        <svg
          class="mk-image__fallback-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="3" y="4" width="18" height="16" rx="2" />
          <circle cx="9" cy="10" r="1.5" />
          <path d="m5 17 4-4 3 3 3.5-3.5L20 17" />
          <path d="m4 3 16 18" />
        </svg>
        <span class="mk-image__fallback-text">{{ i18n.imageFailed }}</span>
      </div>
    }
  </div>
  @if (caption()) {
    <figcaption class="mk-image__caption">{{ caption() }}</figcaption>
  }
</figure>
