<span class="mk-menu-item__icon" aria-hidden="true">
  <ng-content select="[mkMenuItemIcon]" />
</span>
<span class="mk-menu-item__label">
  <ng-content />
</span>
@if (submenu()) {
  <svg
    class="mk-menu-item__chevron"
    viewBox="0 0 16 16"
    width="14"
    height="14"
    fill="none"
    stroke="currentColor"
    stroke-width="1.75"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path d="M6 3.5 10.5 8 6 12.5" />
  </svg>
}
