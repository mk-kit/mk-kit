@if (collapsible() && !railCollapsed()) {
  <button
    type="button"
    class="mk-nav-group__header mk-nav-group__header--toggle"
    [id]="headerId"
    [attr.aria-expanded]="expanded()"
    [attr.aria-controls]="regionId"
    (click)="toggle()"
  >
    <span class="mk-nav-group__label">{{ label() }}</span>
    <span class="mk-nav-group__chevron" aria-hidden="true"></span>
  </button>
} @else if (!railCollapsed()) {
  <p class="mk-nav-group__header" [id]="headerId">
    <span class="mk-nav-group__label">{{ label() }}</span>
  </p>
}

<div
  class="mk-nav-group__items"
  role="list"
  [id]="regionId"
  [attr.aria-labelledby]="railCollapsed() ? null : headerId"
  [attr.aria-label]="railCollapsed() ? label() || null : null"
  [attr.hidden]="itemsVisible() ? null : ''"
>
  <ng-content />
</div>
