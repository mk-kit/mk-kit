<input
  type="text"
  class="mk-tax-id-input__field"
  [id]="inputId"
  autocomplete="off"
  inputmode="numeric"
  spellcheck="false"
  [value]="masked()"
  [attr.maxlength]="maxLength()"
  [placeholder]="effectivePlaceholder()"
  [disabled]="isDisabled()"
  [attr.aria-labelledby]="labelledBy()"
  [attr.aria-label]="labelledBy() ? null : i18n.taxId"
  [attr.aria-describedby]="describedBy()"
  [attr.aria-invalid]="isInvalid() || null"
  [attr.aria-required]="isRequired() || null"
  (input)="onInput($event)"
  (blur)="onBlur()"
/>
