<div class="mk-password-input__field">
  <input
    #input
    class="mk-password-input__input"
    [id]="inputId"
    [type]="revealed() ? 'text' : 'password'"
    [value]="value()"
    [placeholder]="placeholder()"
    [disabled]="isDisabled()"
    autocomplete="current-password"
    [attr.aria-labelledby]="labelledBy()"
    [attr.aria-describedby]="describedBy()"
    [attr.aria-invalid]="isInvalid() || null"
    [attr.aria-required]="isRequired() || null"
    (input)="onInput($event)"
    (blur)="onBlur()"
  />

  <button
    type="button"
    class="mk-password-input__toggle"
    [attr.aria-label]="revealed() ? i18n.hidePassword : i18n.showPassword"
    [attr.aria-pressed]="revealed()"
    [disabled]="isDisabled()"
    (click)="toggleReveal()"
  >
    @if (revealed()) {
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
        <path d="M1 1l22 22" />
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
        <circle cx="12" cy="12" r="3" />
      </svg>
    }
  </button>
</div>

@if (showStrength()) {
  <div
    class="mk-password-input__strength"
    [id]="strengthId"
    role="status"
    aria-live="polite"
  >
    <div class="mk-password-input__meter" aria-hidden="true">
      @for (filled of segments(); track $index) {
        <span
          class="mk-password-input__segment"
          [class.mk-password-input__segment--filled]="filled"
          [attr.data-score]="strength()"
        ></span>
      }
    </div>
    <span class="mk-password-input__strength-label">
      {{ i18n.passwordStrengthLabel }} {{ strengthLabel() }}
    </span>
  </div>
}

@if (showRules()) {
  <ul class="mk-password-input__rules" [id]="rulesId" role="list">
    @for (rule of rules(); track rule.key) {
      <li
        class="mk-password-input__rule"
        [class.mk-password-input__rule--met]="rule.met"
      >
        <span class="mk-password-input__rule-marker" aria-hidden="true">
          {{ rule.met ? '✓' : '○' }}
        </span>
        <span class="mk-visually-hidden">{{ rule.met ? i18n.ruleMet : i18n.ruleNotMet }}</span>
        <span class="mk-password-input__rule-text">{{ rule.label }}</span>
      </li>
    }
  </ul>
}
