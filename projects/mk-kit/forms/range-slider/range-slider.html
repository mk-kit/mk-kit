<div class="mk-range-slider__track-wrap" (pointerdown)="onPointerDown($event)">
  <div #track class="mk-range-slider__track">
    <div
      class="mk-range-slider__fill"
      [style.inset-inline-start.%]="lowPercent()"
      [style.width.%]="highPercent() - lowPercent()"
    ></div>
  </div>

  <div
    #thumb
    class="mk-range-slider__thumb"
    role="slider"
    [attr.tabindex]="isDisabled() ? null : 0"
    [style.inset-inline-start.%]="lowPercent()"
    [attr.aria-label]="minLabel()"
    [attr.aria-labelledby]="labelledBy()"
    [attr.aria-valuemin]="min()"
    [attr.aria-valuemax]="high()"
    [attr.aria-valuenow]="low()"
    [attr.aria-disabled]="isDisabled() || null"
    [attr.aria-invalid]="isInvalid() || null"
    (keydown)="onKeydown(0, $event)"
  ></div>

  <div
    #thumb
    class="mk-range-slider__thumb"
    role="slider"
    [attr.tabindex]="isDisabled() ? null : 0"
    [style.inset-inline-start.%]="highPercent()"
    [attr.aria-label]="maxLabel()"
    [attr.aria-valuemin]="low()"
    [attr.aria-valuemax]="max()"
    [attr.aria-valuenow]="high()"
    [attr.aria-disabled]="isDisabled() || null"
    [attr.aria-invalid]="isInvalid() || null"
    (keydown)="onKeydown(1, $event)"
  ></div>
</div>
