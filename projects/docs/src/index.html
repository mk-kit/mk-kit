<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>mk-kit — Angular admin component library</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="mk-kit — a themable, accessible Angular 22 component library for admin dashboards. Signals, WCAG 2.1 AA, CSS-variable theming, dark mode out of the box."
    />
    <link rel="canonical" href="https://mk-kit.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="mk-kit" />
    <meta property="og:title" content="mk-kit — Angular admin component library" />
    <meta
      property="og:description"
      content="185+ standalone Angular components for dashboards and internal tools. CSS-variable theming, light & dark, WCAG 2.1 AA, MIT."
    />
    <meta property="og:url" content="https://mk-kit.dev/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://mk-kit.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="mk-kit — ship the admin, skip the component library. 190+ Angular components, MIT."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#4f46e5" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "SoftwareSourceCode",
            "@id": "https://mk-kit.dev/#software",
            "name": "mk-kit",
            "description": "Themable, accessible Angular component library for admin dashboards and internal tools.",
            "url": "https://mk-kit.dev/",
            "image": "https://mk-kit.dev/og.png",
            "sameAs": ["https://www.npmjs.com/package/@mk-kit/ui"],
            "codeRepository": "https://github.com/mk-kit/mk-kit",
            "programmingLanguage": "TypeScript",
            "runtimePlatform": "Angular",
            "license": "https://opensource.org/licenses/MIT",
            "author": { "@id": "https://mateuszkornas.com/#person" }
          },
          {
            "@type": "Person",
            "@id": "https://mateuszkornas.com/#person",
            "name": "Mateusz Kornaś",
            "url": "https://mateuszkornas.com",
            "sameAs": ["https://github.com/mkornas", "https://azwidgets.pl", "https://rozpedzeni.pl"]
          }
        ]
      }
    </script>
    <!-- Manrope: the "momentum" preset demo on /theming. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" />
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('mk-kit-theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-mk-theme', t);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="mk-app">
    <app-root></app-root>
    <!-- AZ Widgets: contact forms (Pro waitlist / Team), consent banner, analytics. -->
    <script src="https://cdn.azwidgets.pl/loader.js" data-tenant="mk-kit" defer></script>
  </body>
</html>
