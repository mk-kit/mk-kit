<mk-app-shell #shell>
  <!-- Header -->
  <div mkAppHeader class="docs-header">
    <div class="docs-header__left">
      @if (shell.isMobile()) {
        <button
          mkButton
          variant="ghost"
          tone="neutral"
          iconOnly
          aria-label="Toggle navigation"
          (click)="shell.toggleSidebar()"
        >
          ☰
        </button>
      } @else {
        <button
          mkButton
          variant="ghost"
          tone="neutral"
          iconOnly
          aria-label="Collapse sidebar"
          (click)="shell.toggleCollapsed()"
        >
          ⟨⟩
        </button>
      }
      <a
        class="docs-brand"
        href="/introduction"
        (click)="$event.preventDefault(); go(shell, '/introduction')"
      >
        <span class="docs-brand__mark">mk</span>
        <span class="docs-brand__name">mk-kit</span>
        <span class="docs-brand__ver">v{{ uiVersion }}</span>
      </a>
    </div>

    <div class="docs-header__right">
      <button
        mkButton
        variant="outline"
        tone="neutral"
        size="sm"
        class="docs-search-btn"
        (click)="searchOpen.set(true)"
      >
        <span aria-hidden="true">⌕</span>
        Search
        <kbd class="docs-kbd" aria-hidden="true">⌘K</kbd>
      </button>
      <button
        mkButton
        variant="outline"
        tone="neutral"
        size="sm"
        (click)="theme.toggleDensity()"
        [attr.aria-label]="'Density: ' + theme.density() + '. Click to toggle.'"
      >
        <span aria-hidden="true">{{ theme.density() === 'compact' ? '▤' : '☰' }}</span>
        {{ theme.density() === 'compact' ? 'Compact' : 'Comfortable' }}
      </button>
      <button
        mkButton
        variant="outline"
        tone="neutral"
        size="sm"
        (click)="cycleTheme()"
        [attr.aria-label]="'Theme: ' + themeLabel() + '. Click to change.'"
      >
        <span aria-hidden="true">{{ themeIcon() }}</span>
        {{ themeLabel() }}
      </button>
      <a
        mkButton
        variant="ghost"
        tone="neutral"
        size="sm"
        href="https://github.com/mkornas/mk-kit"
        target="_blank"
        rel="noopener"
      >
        GitHub ↗
      </a>
    </div>
  </div>

  <!-- Sidebar -->
  <mk-nav-list
    mkAppSidebar
    [collapsed]="shell.sidebarCollapsed() && !shell.isMobile()"
  >
    @for (section of sections; track section.title) {
      <mk-nav-group [label]="section.title" [collapsible]="!!section.collapsible">
        @for (link of section.links; track link.path) {
          <mk-nav-item
            [label]="link.label"
            [active]="isActive(link.path)"
            (action)="go(shell, link.path)"
          >
            <span mkNavIcon aria-hidden="true">{{ link.icon }}</span>
          </mk-nav-item>
        }
      </mk-nav-group>
    }
  </mk-nav-list>

  <!-- Main content -->
  <router-outlet />

  <!-- On-this-page rail (auto-generated from the routed page's h2 headings) -->
  <docs-toc />
</mk-app-shell>

<!-- ⌘K docs search -->
<mk-command-palette [(open)]="searchOpen" [commands]="searchCommands" />
