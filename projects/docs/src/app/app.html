<mk-app-shell #shell>
  <!-- Header -->
  <div mkAppHeader class="docs-header mk-print-hidden">
    <div class="docs-header__left">
      @if (shell.isMobile() && !isHome()) {
        <button
          mkButton
          variant="ghost"
          tone="neutral"
          iconOnly
          aria-label="Toggle navigation"
          (click)="shell.toggleSidebar()"
        >
          ☰
        </button>
      }
      <a class="docs-brand" routerLink="/">
        <span class="docs-brand__mark">mk</span>
        <span class="docs-brand__name">mk-kit</span>
      </a>
      <a
        class="docs-brand__ver"
        routerLink="/changelog"
        style="text-decoration: none"
        [attr.aria-label]="'Version ' + uiVersion + ' — view changelog'"
        >v{{ uiVersion }}</a
      >
    </div>

    <div class="docs-header__right">
      <nav class="docs-header__nav" aria-label="Site">
        <a
          mkButton
          variant="ghost"
          tone="neutral"
          size="sm"
          routerLink="/introduction"
          routerLinkActive="docs-header__nav-link--active"
          class="docs-header__nav-link"
          >Docs</a
        >
        <a
          mkButton
          variant="ghost"
          tone="neutral"
          size="sm"
          routerLink="/blog"
          routerLinkActive="docs-header__nav-link--active"
          class="docs-header__nav-link"
          >Blog</a
        >
      </nav>
      <button
        mkButton
        variant="outline"
        tone="neutral"
        size="sm"
        class="docs-search-btn"
        (click)="searchOpen.set(true)"
      >
        <span aria-hidden="true">⌕</span>
        Search
        <kbd class="docs-kbd" aria-hidden="true">⌘K</kbd>
      </button>
      <button
        mkButton
        variant="ghost"
        tone="neutral"
        size="sm"
        iconOnly
        (click)="cycleDensity()"
        [attr.aria-label]="'Density: ' + theme.density() + '. Click to change.'"
      >
        {{ densityIcon() }}
      </button>
      <button
        mkButton
        variant="ghost"
        tone="neutral"
        size="sm"
        iconOnly
        (click)="cycleContrast()"
        [attr.aria-label]="'Contrast: ' + contrastLabel() + '. Click to change.'"
      >
        ◧
      </button>
      <button
        mkButton
        variant="ghost"
        tone="neutral"
        size="sm"
        iconOnly
        (click)="cycleTheme()"
        [attr.aria-label]="'Theme: ' + themeLabel() + '. Click to change.'"
      >
        {{ themeIcon() }}
      </button>
      <a
        mkButton
        variant="ghost"
        tone="neutral"
        size="sm"
        class="docs-github"
        href="https://github.com/mk-kit/mk-kit"
        target="_blank"
        rel="noopener"
      >
        GitHub ↗
      </a>
    </div>
  </div>

  <!-- Sidebar: flat, text-only navigation (hidden on the landing page) -->
  <nav mkAppSidebar class="docs-nav mk-print-hidden" aria-label="Documentation" [hidden]="isHome()">
    @for (section of sections; track section.title) {
      <div class="docs-nav__group">
        <p class="docs-nav__heading">{{ section.title }}</p>
        @for (link of section.links; track link.path) {
          <a
            class="docs-nav__link"
            [routerLink]="link.path"
            routerLinkActive="docs-nav__link--active"
            (click)="shell.closeSidebar()"
            >{{ link.label }}</a
          >
        }
      </div>
    }
  </nav>

  <!-- Main content -->
  <router-outlet />

  <!-- On-this-page rail (auto-generated from the routed page's h2 headings) -->
  <docs-toc class="mk-print-hidden" />
</mk-app-shell>

<!-- ⌘K docs search -->
<mk-command-palette [(open)]="searchOpen" [commands]="searchCommands" />

<!-- Cookie consent (AZ Widgets) — themed via --az-* in styles.scss -->
<az-consent [attr.tenant]="site.azTenant" position="bar" locale="en" [attr.theme]="theme.resolvedTheme()"></az-consent>
