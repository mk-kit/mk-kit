<mk-app-shell #shell>
  <!-- Header -->
  <div mkAppHeader class="docs-header">
    <div class="docs-header__left">
      @if (shell.isMobile()) {
        <button
          mkButton
          variant="ghost"
          tone="neutral"
          iconOnly
          aria-label="Toggle navigation"
          (click)="shell.toggleSidebar()"
        >
          ☰
        </button>
      }
      <a class="docs-brand" routerLink="/introduction">
        <span class="docs-brand__mark">mk</span>
        <span class="docs-brand__name">mk-kit</span>
        <span class="docs-brand__ver">v{{ uiVersion }}</span>
      </a>
    </div>

    <div class="docs-header__right">
      <button
        mkButton
        variant="outline"
        tone="neutral"
        size="sm"
        class="docs-search-btn"
        (click)="searchOpen.set(true)"
      >
        <span aria-hidden="true">⌕</span>
        Search
        <kbd class="docs-kbd" aria-hidden="true">⌘K</kbd>
      </button>
      <button
        mkButton
        variant="ghost"
        tone="neutral"
        size="sm"
        iconOnly
        (click)="theme.toggleDensity()"
        [attr.aria-label]="'Density: ' + theme.density() + '. Click to toggle.'"
      >
        {{ theme.density() === 'compact' ? '▤' : '☰' }}
      </button>
      <button
        mkButton
        variant="ghost"
        tone="neutral"
        size="sm"
        iconOnly
        (click)="cycleTheme()"
        [attr.aria-label]="'Theme: ' + themeLabel() + '. Click to change.'"
      >
        {{ themeIcon() }}
      </button>
      <a
        mkButton
        variant="ghost"
        tone="neutral"
        size="sm"
        href="https://github.com/mkornas/mk-kit"
        target="_blank"
        rel="noopener"
      >
        GitHub ↗
      </a>
    </div>
  </div>

  <!-- Sidebar: flat, text-only navigation -->
  <nav mkAppSidebar class="docs-nav" aria-label="Documentation">
    @for (section of sections; track section.title) {
      <div class="docs-nav__group">
        <p class="docs-nav__heading">{{ section.title }}</p>
        @for (link of section.links; track link.path) {
          <a
            class="docs-nav__link"
            [routerLink]="link.path"
            routerLinkActive="docs-nav__link--active"
            (click)="shell.closeSidebar()"
            >{{ link.label }}</a
          >
        }
      </div>
    }
  </nav>

  <!-- Main content -->
  <router-outlet />

  <!-- On-this-page rail (auto-generated from the routed page's h2 headings) -->
  <docs-toc />
</mk-app-shell>

<!-- ⌘K docs search -->
<mk-command-palette [(open)]="searchOpen" [commands]="searchCommands" />
